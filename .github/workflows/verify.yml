name: Verify DECODE submission

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbformat nbclient ipykernel
      - name: Verify reproducible Python analysis
        run: python -m unittest discover -s tests -v
      - name: Run every code cell in submitted notebook
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import nbformat
          from nbclient import NotebookClient

          source = Path("DECODE_Competition_Intelligence_Colab.ipynb")
          nb = nbformat.read(source, as_version=4)
          with TemporaryDirectory() as temp:
              NotebookClient(
                  nb,
                  timeout=120,
                  kernel_name="python3",
                  allow_errors=False,
                  resources={"metadata": {"path": temp}},
              ).execute()
              summary = json.loads((Path(temp) / "outputs" / "summary.json").read_text())
              assert summary["raw_rows"] == 109
              assert summary["clean_rows"] == 108
              assert summary["teams"] == 18
              assert summary["overall_top5"][0] == "T08"
              assert summary["team_3470_overall_rank"] == 6
              assert summary["team_3470_best_partners"] == [
                  "T08", "T14", "T17", "T02", "T06"
              ]
              assert (Path(temp) / "DECODE_Candidate_1_cleaned_colab.xlsx").is_file()
              assert (Path(temp) / "DECODE_Colab_Analysis_Outputs.zip").is_file()
              print("Full submitted notebook executed and validated successfully.")
          PY
